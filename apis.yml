name: Deep Render
description: >-
  Deep Render is an artificial-intelligence company that developed
  neural-network-based ("learned") video and image compression technology,
  aiming to replace traditional hand-engineered codecs such as H.264/HEVC/AV1
  with deep-learning models for higher compression efficiency. Founded as a
  London-based startup, it was backed by Speedinvest and was surfaced into the
  API Evangelist network through VC-portfolio discovery. As of this enrichment
  pass its primary domain, deeprender.ai, issues a blanket HTTP 301 redirect to
  InterDigital's Video Lab (https://www.interdigital.com/video-lab/), indicating
  the company and its compression technology have been absorbed into
  InterDigital. Deep Render publishes no independent developer portal, API,
  documentation, SDK, or other machine-readable surface for enrichment at this
  time.
